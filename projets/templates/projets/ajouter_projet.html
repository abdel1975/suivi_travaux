<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ajouter un nouveau projet</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fa; padding:20px; }
    h2 { text-align:center; color:#388E3C; }
    form { background:#fff; padding:20px; border-radius:10px; max-width:800px; margin:20px auto; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    label { font-weight:bold; }
    input, select { width:100%; padding:8px; margin:6px 0 14px; border:1px solid #ccc; border-radius:6px; }
    #map { height: 380px; border-radius: 10px; margin: 10px 0 16px; }
    button { background:#388E3C; color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; }
    button:hover { background:#2E7D32; }
  </style>
</head>
<body>
  <h2>Ajouter un nouveau projet</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <!-- Carte Leaflet pour capturer latitude/longitude -->
    <div id="map"></div>

    <button type="submit">💾 Enregistrer</button>
  </form>

  <script>
    // Maroc centré
    var map = L.map('map').setView([31.7917, -7.0926], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    var marker;
    map.on('click', function(e) {
      if (marker) map.removeLayer(marker);
      marker = L.marker(e.latlng).addTo(map);
      document.getElementById('id_latitude').value  = e.latlng.lat;
      document.getElementById('id_longitude').value = e.latlng.lng;
    });
  </script>
</body>
</html>
