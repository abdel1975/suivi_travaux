<!DOCTYPE html>
<html lang="fr">
{% load static %}
<head>
  <meta charset="UTF-8">
  <title>Connexion – المنصة الرقمية لتتبع المشاريع</title>

  <!-- Police arabe -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ✅ Bande verte avec logo centré */
    .header {
      background: linear-gradient(135deg, #2E7D32, #4CAF50);
      width: 100%;
      padding: 30px 0 20px 0;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
    }

    .header img {
      height: 110px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }

    .header h2 {
      font-family: 'Amiri', serif;
      color: white;
      margin-top: 10px;
      font-size: 26px;
    }

    /* ✅ Boîte de connexion */
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      width: 340px;
      text-align: center;
      margin-top: 220px; /* pour laisser la place au logo */
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      background: #2E7D32;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1B5E20;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <!-- ✅ Bande verte avec logo -->
  <div class="header">
    <img src="{% static 'projets/logo_men.jpg' %}" alt="Logo">
    <h2>المنصة الرقمية لتتبع المشاريع</h2>
  </div>

  <!-- ✅ Formulaire -->
  <div class="login-box">
    <h2>Connexion</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Se connecter</button>
    </form>

    {% if form.errors %}
      <p class="error">Nom d’utilisateur ou mot de passe incorrect</p>
    {% endif %}
  </div>
</body>
</html>
